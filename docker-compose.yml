services:

  postgres:
    image: postgres:16-alpine
    container_name: my-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: my-app-db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: my-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: apps/server/server.Dockerfile
    container_name: my-server
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - apps/server/.env.docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "
        echo '🔍 Checking if dist files exist...' &&
        ls -la /app/apps/server/dist &&
        ls -la /app/apps/server/dist/index.js &&
        ls -la /app/apps/server/dist/cron/emailFetcher.js &&
        ls -la /app/apps/server/dist/worker/aiProcessor.js &&
        echo '✅ All files exist!' &&
        echo '🔄 Running Prisma migrations...' &&
        cd /app/packages/db && 
        npx prisma migrate deploy &&
        echo '✅ Migrations complete!' &&
        echo '🚀 Starting PM2...' &&
        cd /app/apps/server &&
        pm2-runtime start ecosystem.config.cjs
      "

    stdin_open: true
    tty: true

  web: 
    build:
      context: .
      dockerfile: apps/web/web.Dockerfile
    container_name: my-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - apps/web/.env.docker
    depends_on:
      - server
    command: sh -c "node apps/web/server.js"

volumes:
  postgres_data:
  redis_data:
